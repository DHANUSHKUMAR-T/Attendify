{% extends "base.html" %}

{% block title %}Edit Student Profile - Attendify(CSC){% endblock %}

{% block content %}
<div class="auth-container register-container glass-effect fade-in-up" style="max-width: 600px; margin: 0 auto; padding: 2.5rem; width: 100%; border-radius: 16px;">
    <div class="auth-header" style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.8rem; color: var(--primary); display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 0.5rem;">
            <i class="fa-solid fa-user-pen"></i> Edit Student Profile
        </h2>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Modify profile details for {{ student.name }}</p>
    </div>
    
    <form method="POST" action="{{ url_for('edit_student', student_id=student._id|string) }}" class="auth-form" style="display: flex; flex-direction: column; gap: 1.2rem;">
        <div class="form-row" style="display: flex; gap: 1.2rem; flex-wrap: wrap;">
            <div class="form-group half-width" style="flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 0.4rem;">
                <label style="font-weight: 600; font-size: 0.85rem; color: var(--dark);">Register Number</label>
                <div class="input-icon-wrapper" style="position: relative;">
                    <i class="fa-solid fa-id-card input-icon" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="text" name="register_number" class="form-control" value="{{ student.register_number }}" required style="padding: 0.6rem 0.6rem 0.6rem 2.8rem; border-radius: 8px; border: 1px solid rgba(0,0,0,0.1); width: 100%; text-transform: uppercase;">
                </div>
            </div>
            <div class="form-group half-width" style="flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 0.4rem;">
                <label style="font-weight: 600; font-size: 0.85rem; color: var(--dark);">Full Name</label>
                <div class="input-icon-wrapper" style="position: relative;">
                    <i class="fa-solid fa-user input-icon" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="text" name="name" class="form-control" value="{{ student.name }}" required style="padding: 0.6rem 0.6rem 0.6rem 2.8rem; border-radius: 8px; border: 1px solid rgba(0,0,0,0.1); width: 100%;">
                </div>
            </div>
        </div>

        <div class="form-row" style="display: flex; gap: 1.2rem; flex-wrap: wrap;">
            <div class="form-group half-width" style="flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 0.4rem;">
                <label style="font-weight: 600; font-size: 0.85rem; color: var(--dark);">Course</label>
                <div class="input-icon-wrapper" style="position: relative;">
                    <i class="fa-solid fa-graduation-cap input-icon" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <select name="course" class="form-control" required style="padding: 0.6rem 0.6rem 0.6rem 2.8rem; border-radius: 8px; border: 1px solid rgba(0,0,0,0.1); width: 100%; background-color: white; cursor: pointer;">
                        <option value="ADAD" {% if student.course == 'ADAD' %}selected{% endif %}>ADAD</option>
                        <option value="ADCHN" {% if student.course == 'ADCHN' %}selected{% endif %}>ADCHN</option>
                        <option value="ADDA" {% if student.course == 'ADDA' %}selected{% endif %}>ADDA</option>
                        <option value="ADJP" {% if student.course == 'ADJP' %}selected{% endif %}>ADJP</option>
                        <option value="ADMS" {% if student.course == 'ADMS' %}selected{% endif %}>ADMS</option>
                        <option value="ADPP" {% if student.course == 'ADPP' %}selected{% endif %}>ADPP</option>
                        <option value="ADCA" {% if student.course == 'ADCA' %}selected{% endif %}>ADCA</option>
                        <option value="DCA" {% if student.course == 'DCA' %}selected{% endif %}>DCA</option>
                        <option value="DFJD" {% if student.course == 'DFJD' %}selected{% endif %}>DFJD</option>
                        <option value="DFPD" {% if student.course == 'DFPD' %}selected{% endif %}>DFPD</option>
                        <option value="DMO" {% if student.course == 'DMO' %}selected{% endif %}>DMO</option>
                        <option value="DPFD" {% if student.course == 'DPFD' %}selected{% endif %}>DPFD</option>
                        <option value="HDCA" {% if student.course == 'HDCA' %}selected{% endif %}>HDCA</option>
                        <option value="HDFD" {% if student.course == 'HDFD' %}selected{% endif %}>HDFD</option>
                        <option value="MDSA" {% if student.course == 'MDSA' %}selected{% endif %}>MDSA</option>
                        <option value="CCAE" {% if student.course == 'CCAE' %}selected{% endif %}>CCAE</option>
                        <option value="CCA" {% if student.course == 'CCA' %}selected{% endif %}>CCA</option>
                        <option value="JDCS" {% if student.course == 'JDCS' %}selected{% endif %}>JDCS</option>
                    </select>
                </div>
            </div>
            <div class="form-group half-width" style="flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 0.4rem;">
                <label style="font-weight: 600; font-size: 0.85rem; color: var(--dark);">Mobile</label>
                <div class="input-icon-wrapper" style="position: relative;">
                    <i class="fa-solid fa-phone input-icon" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="text" name="mobile" class="form-control" value="{{ student.mobile|default('') }}" required style="padding: 0.6rem 0.6rem 0.6rem 2.8rem; border-radius: 8px; border: 1px solid rgba(0,0,0,0.1); width: 100%;">
                </div>
            </div>
        </div>

        <div class="form-row" style="display: flex; flex-direction: column; gap: 0.4rem; width: 100%;">
            <label style="font-weight: 600; font-size: 0.85rem; color: var(--dark);">New Password (Leave blank to keep current)</label>
            <div class="input-icon-wrapper" style="position: relative;">
                <i class="fa-solid fa-key input-icon" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                <input type="password" name="password" class="form-control" placeholder="Enter new password to reset" style="padding: 0.6rem 0.6rem 0.6rem 2.8rem; border-radius: 8px; border: 1px solid rgba(0,0,0,0.1); width: 100%;">
            </div>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem; width: 100%; flex-wrap: wrap;">
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary" style="flex: 1; min-width: 120px; text-align: center; display: flex; align-items: center; justify-content: center; background: #6b7280; color: white; padding: 0.7rem; border-radius: 8px; font-weight: 600; text-decoration: none; border: none; cursor: pointer; gap: 0.5rem;">
                <i class="fa-solid fa-xmark"></i> Cancel
            </a>
            <button type="submit" class="btn btn-primary" style="flex: 1; min-width: 120px; padding: 0.7rem; border-radius: 8px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer;">
                <i class="fa-solid fa-floppy-disk"></i> Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
